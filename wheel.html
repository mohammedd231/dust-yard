<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Dust Yard — Phone Wheel</title>
<style>
  :root{ --bg:#07080e; --fg:#eef0f8; --mut:#9aa1bd; --hot:#ff2fd6; --go:#2bff5a; --stop:#ff3b4a; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; touch-action:none; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,sans-serif; overflow:hidden; overscroll-behavior:none; }
  #intro{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:24px; text-align:center; background:radial-gradient(60% 50% at 50% 40%, #16122a 0%, #07080e 75%); }
  #intro h1{ font-size:26px; margin:0; letter-spacing:.02em; } #intro p{ color:var(--mut); margin:0; max-width:320px; line-height:1.5; }
  .big{ border:0; border-radius:16px; padding:18px 34px; font-size:20px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#fff; background:linear-gradient(90deg,var(--hot),#ff7a1a); box-shadow:0 0 30px rgba(255,47,214,.5); cursor:pointer; }
  #pad{ position:fixed; inset:0; display:none; }
  #bar{ position:absolute; top:0; left:0; right:0; display:flex; align-items:center; gap:12px; padding:calc(env(safe-area-inset-top,0) + 8px) 14px 8px; font-size:13px; }
  #dot{ width:10px; height:10px; border-radius:50%; background:var(--stop); box-shadow:0 0 8px currentColor; color:var(--stop); }
  #dot.ok{ background:var(--go); color:var(--go); }
  #bar .sp{ flex:1; }
  #bar button, #bar label{ background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); color:var(--fg); border-radius:10px; padding:8px 12px; font-size:13px; }
  #sens{ width:96px; vertical-align:middle; }
  .wheelwrap{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:min(46vh,300px); height:min(46vh,300px); display:flex; align-items:center; justify-content:center; pointer-events:none; }
  #wheel{ width:100%; height:100%; filter:drop-shadow(0 0 18px rgba(47,168,255,.25)); }
  .pedal{ position:absolute; bottom:0; width:30vw; max-width:220px; height:56vh; display:flex; align-items:flex-end; justify-content:center; padding-bottom:calc(env(safe-area-inset-bottom,0) + 18px); font-weight:800; font-size:20px; letter-spacing:.08em; text-transform:uppercase; }
  #gas{ right:0; background:linear-gradient(0deg, rgba(43,255,90,.28), rgba(43,255,90,0) 70%); border-left:1px solid rgba(255,255,255,.06); color:var(--go); }
  #brake{ left:0; background:linear-gradient(0deg, rgba(255,59,74,.28), rgba(255,59,74,0) 70%); border-right:1px solid rgba(255,255,255,.06); color:var(--stop); }
  .pedal.down{ filter:brightness(1.7); }
  .mid{ position:absolute; left:50%; bottom:calc(env(safe-area-inset-bottom,0) + 14px); transform:translateX(-50%); display:flex; gap:10px; }
  .mid button{ border:1px solid rgba(255,255,255,.16); background:rgba(14,16,28,.8); color:#fff; border-radius:12px; padding:12px 14px; font-size:14px; font-weight:700; letter-spacing:.04em; }
  .mid button.down{ background:#fff; color:#0a0b14; }
  #hb{ color:#ffd43b; }
  #rotate{ position:absolute; inset:auto 0 70px; text-align:center; color:var(--mut); font-size:12px; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<div id="intro">
  <h1>Phone Steering Wheel</h1>
  <p id="hint">Hold your phone like a wheel and turn it to steer. Tap below to connect and allow motion access.</p>
  <button id="go" class="big">Connect</button>
  <p id="room" style="font-size:13px;opacity:.6"></p>
</div>

<div id="pad">
  <div id="bar">
    <span id="dot"></span><span id="stat">connecting…</span>
    <span class="sp"></span>
    <label>Sens <input id="sens" type="range" min="0.7" max="2.6" step="0.1" value="1.5"></label>
    <button id="inv">Invert: off</button>
    <button id="center">Center</button>
  </div>
  <div class="wheelwrap">
    <svg id="wheel" viewBox="-50 -50 100 100">
      <circle r="46" fill="none" stroke="#2a2f45" stroke-width="7"/>
      <circle r="46" fill="none" stroke="#2fa8ff" stroke-width="3" stroke-dasharray="4 8" opacity=".5"/>
      <circle r="9" fill="#2fa8ff"/>
      <rect x="-3.5" y="-46" width="7" height="22" rx="3" fill="#2fa8ff"/>
      <rect x="-44" y="-3.5" width="38" height="7" rx="3" fill="#2a2f45"/>
      <rect x="6" y="-3.5" width="38" height="7" rx="3" fill="#2a2f45"/>
    </svg>
  </div>
  <div id="brake" class="pedal">Brake</div>
  <div id="gas" class="pedal">Gas</div>
  <div class="mid">
    <button id="start">Start</button>
    <button id="hb">Handbrake</button>
    <button id="rev">Rev</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const room = (location.hash || '').replace(/^#/, '').replace(/[^a-z0-9]/gi, '').toLowerCase().slice(0, 12);
$('room').textContent = room ? ('Room ' + room.toUpperCase()) : 'No room code — open this page from the game screen.';

const SB_URL = 'https://vuykcfntjnddiponkvnl.supabase.co', SB_KEY = 'sb_publishable_N_rEQjCq1_PBIs66-kCukw_sq_Tq0uG';
const W = { s:0, g:0, b:0, h:0, r:0, raw:0, center:Math.PI, sens:1.5, inv:1 };
let ch = null, acked = false;

function haptic(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

// ---- sensor: steering from gravity in the screen plane (works in any upright hold) ----
function onMotion(e){
  const a = e.accelerationIncludingGravity; if(!a) return;
  W.raw = Math.atan2(a.x, a.y);                 // wheel angle: roll in the screen plane
  let d = W.raw - W.center; while(d > Math.PI) d -= 2*Math.PI; while(d < -Math.PI) d += 2*Math.PI;
  W.s = clamp(d * W.sens * W.inv, -1, 1);
  $('wheel').style.transform = 'rotate(' + (-d * W.inv) + 'rad)';
}
async function enableSensors(){
  try{ if(window.DeviceMotionEvent && DeviceMotionEvent.requestPermission){ const p = await DeviceMotionEvent.requestPermission(); if(p !== 'granted') $('hint').textContent = 'Motion access was blocked. In Settings → Safari → Motion & Orientation Access, turn it on, then reload.'; } }catch(e){}
  window.addEventListener('devicemotion', onMotion, true);
}

// ---- realtime link to the PC game ----
function connect(){
  if(!window.supabase || !room) return;
  const sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:false, autoRefreshToken:false}, realtime:{params:{eventsPerSecond:40}}});
  ch = sb.channel('dydrift-wheel-' + room, {config:{broadcast:{self:false, ack:false}}});
  ch.on('broadcast', {event:'ack'}, () => { acked = true; $('dot').classList.add('ok'); $('stat').textContent = 'connected to PC'; });
  ch.subscribe(st => {
    if(st === 'SUBSCRIBED'){ $('stat').textContent = 'waiting for PC…'; send('hi', {}); }
  });
}
function send(ev, pl){ if(!ch) return; try{ const p = ch.send({type:'broadcast', event:ev, payload:pl}); if(p && p.catch) p.catch(() => {}); }catch(e){} }

let lastSent = 0;
function loop(t){
  requestAnimationFrame(loop);
  if(ch && t - lastSent > 33){ lastSent = t; send('w', {s:+W.s.toFixed(3), g:W.g, b:W.b, h:W.h, r:W.r}); if(!acked) send('hi', {}); }
}

// ---- controls ----
function hold(el, on){
  const set = v => { el.classList.toggle('down', !!v); on(v ? 1 : 0); };
  el.addEventListener('touchstart', e => { e.preventDefault(); set(1); haptic(8); }, {passive:false});
  el.addEventListener('touchend',   e => { e.preventDefault(); set(0); }, {passive:false});
  el.addEventListener('touchcancel',e => { e.preventDefault(); set(0); }, {passive:false});
}
hold($('gas'),   v => W.g = v);
hold($('brake'), v => W.b = v);
hold($('hb'),    v => W.h = v);
hold($('rev'),   v => W.r = v);
$('start').addEventListener('touchstart', e => { e.preventDefault(); send('start', {}); haptic(20); $('start').classList.add('down'); setTimeout(() => $('start').classList.remove('down'), 150); }, {passive:false});
$('center').addEventListener('click', () => { W.center = W.raw; haptic(12); });
$('sens').addEventListener('input', e => W.sens = +e.target.value);
$('inv').addEventListener('click', () => { W.inv = -W.inv; $('inv').textContent = 'Invert: ' + (W.inv < 0 ? 'on' : 'off'); });

$('go').addEventListener('click', async () => {
  await enableSensors();
  W.center = W.raw || Math.PI;                 // current hold becomes straight-ahead
  try{ await document.documentElement.requestFullscreen(); }catch(e){}
  try{ await screen.orientation.lock('landscape'); }catch(e){}
  $('intro').style.display = 'none'; $('pad').style.display = 'block';
  connect(); requestAnimationFrame(loop);
});
// keep the screen awake if supported
(async () => { try{ await navigator.wakeLock.request('screen'); }catch(e){} })();
</script>
</body>
</html>
